<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"   style="stop-color:#b85a5a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a3030;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wave-fg" x1="0.1" x2="0.9" y1="0" y2="0">
      <stop offset="0%"   style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="50%"  style="stop-color:#ffffff;stop-opacity:0.60" />
      <stop offset="100%" style="stop-color:#ffe8e8;stop-opacity:0.30" />
    </linearGradient>
  </defs>

  <!-- Squircle background -->
  <path d="
    M 128 8
    C 52 8,  24 26, 12 46
    C  4 58,  8 68,  8 128
