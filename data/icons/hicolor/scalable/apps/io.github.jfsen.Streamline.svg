    C 252 198, 248 188, 248 128
    C 248 68, 252 58, 244 46
    C 232 26, 204 8,  128 8
    Z"
    fill="url(#bg-grad)" />

  <!-- Wave-y S symbol: outer contour (clockwise) and inner contour (counter-clockwise) -->
  <path d="
    M 80  82
