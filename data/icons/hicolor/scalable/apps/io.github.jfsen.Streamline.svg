    C 186 98, 196 118, 196 128
    C 196 138, 186 158, 162 170
    C 128 186, 80  184, 80 174
    C 80  164, 128 162, 152 150
    C 168 142, 172 132, 172 128
    C 172 124, 168 114, 152 106
    C 128 94,  80  92,  80  82
    Z"
    fill="url(#wave-fg)" />

  <!-- Subtle inner shadow / depth ring -->
  <path d="
    M 128 8
    C 52 8,  24 26, 12 46
    C  4 58,  8 68,  8 128
    C  8 188,  4 198, 12 210
    C 24 230, 52 248, 128 248
    C 204 248, 232 230, 244 210
    C 252 198, 248 188, 248 128
